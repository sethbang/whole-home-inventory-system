# Ruff config for the WHIS backend.
#
# Replaces black + isort + flake8 with one tool. Line length matches the
# existing Black-style (CLAUDE.md documents 88 columns).

line-length = 88
target-version = "py311"

extend-exclude = [
    "alembic/versions/",  # generated migrations — don't lint autogenerated code
    "venv/",
    ".venv/",
]

[lint]
# Start conservative so we don't drown in a sea of existing-code warnings.
# We can ratchet up (N, PLR, UP) as the codebase is modernized.
select = [
    "E",    # pycodestyle errors
    "F",    # pyflakes
    "I",    # isort
    "B",    # flake8-bugbear (common pitfalls)
    "W",    # pycodestyle warnings
    "C4",   # comprehensions
    "SIM",  # simplifications
]
ignore = [
    "E501",   # line length handled by formatter
    "B008",   # FastAPI's Depends() is the canonical default-argument use case
    "B904",   # "raise from" is ergonomic polish; our global handler captures
              # context via logger.exception already. Revisit in v2.2 refactor.
    "SIM108", # ternary-vs-if — often less readable for non-trivial branches
]

[lint.per-file-ignores]
"tests/**" = ["B011"]  # `assert False` is fine in tests

[format]
quote-style = "double"
indent-style = "space"

# NAS deployment compose.
#
# Usage: create a sibling `.env` file (or export vars) with at minimum:
#   SECRET_KEY=<result of: python -c "import secrets; print(secrets.token_urlsafe(64))">
# optional:
#   WHIS_DOMAIN=inventory.example.com      # public DNS → Let's Encrypt cert
#   WHIS_DOMAIN=whis.local                  # default → Caddy internal CA
#   CADDY_ACME_EMAIL=you@example.com
# then:
#   docker compose -f docker-compose.nas.yml up --build -d
#
# Frontend traffic terminates at Caddy on ports 80/443. When WHIS_DOMAIN
# resolves publicly, Caddy auto-provisions a Let's Encrypt cert on first
# request; otherwise it serves via its internal CA (install the root cert
# from /data/caddy/pki/authorities/local/root.crt on each household
# device). See DEPLOYMENT.md for the step-by-step.
#
# This file intentionally never sets BYPASS_AUTH=true: a NAS deployment is
# a shared environment, and the backend's fail-fast check on SECRET_KEY
# would also need to pass — so real auth is mandatory here.

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    environment:
      BYPASS_AUTH: "false"
      SECRET_KEY: ${SECRET_KEY:?SECRET_KEY must be set in the environment or .env file}
      ACCESS_TOKEN_EXPIRE_MINUTES: "${ACCESS_TOKEN_EXPIRE_MINUTES:-30}"
      DATABASE_URL: "${DATABASE_URL:-sqlite:////app/database/whis.db}"
      # NAS deployments get the async job queue by default — the worker
      # service below is always on (no profile gating). Operators who
      # don't want it can override REDIS_URL to empty.
      REDIS_URL: "${REDIS_URL:-redis://redis:6379/0}"
      UPLOAD_DIR: "/app/backend/uploads"
      BACKUP_DIR: "/app/backend/backups"
      # Caddy fronts the backend same-origin (WHIS_DOMAIN → backend on the
      # internal network), so the browser never issues cross-origin
      # requests. NAS_ORIGINS is kept as a belt-and-suspenders override for
      # operators who deploy behind an upstream TLS terminator.
      CORS_ORIGINS: "${NAS_ORIGINS:-https://${WHIS_DOMAIN:-whis.local}}"
      CORS_ALLOW_METHODS: "GET,POST,PUT,DELETE,OPTIONS,HEAD,PATCH"
      CORS_ALLOW_HEADERS: "Content-Type,Authorization,Accept,Origin,X-Requested-With"
      LOG_LEVEL: "${LOG_LEVEL:-INFO}"
      LOG_FORMAT: "${LOG_FORMAT-}"
      DEBUG: "false"
      # Upload + image limits (settings defaults kick in when unset).
      MAX_UPLOAD_BYTES: "${MAX_UPLOAD_BYTES-}"
      MAX_IMAGE_DIMENSION: "${MAX_IMAGE_DIMENSION-}"
      # Postgres connection-pool tuning (ignored on SQLite).
      DB_POOL_SIZE: "${DB_POOL_SIZE-}"
      DB_MAX_OVERFLOW: "${DB_MAX_OVERFLOW-}"
      DB_POOL_RECYCLE_SECONDS: "${DB_POOL_RECYCLE_SECONDS-}"
      # OpenTelemetry (off by default).
      OTEL_ENABLED: "${OTEL_ENABLED-}"
      OTEL_SERVICE_NAME: "${OTEL_SERVICE_NAME-}"
      OTEL_EXPORTER_OTLP_ENDPOINT: "${OTEL_EXPORTER_OTLP_ENDPOINT-}"
      # v3.1 shared LLM layer (Vision + Pricing ride on this).
      LLM_BASE_URL: "${LLM_BASE_URL-}"
      LLM_API_KEY: "${LLM_API_KEY-}"
      LLM_MODEL: "${LLM_MODEL-}"
      LLM_PRICING_MODEL: "${LLM_PRICING_MODEL-}"
      LLM_TIMEOUT_SECONDS: "${LLM_TIMEOUT_SECONDS-}"
      LLM_ALLOW_CLOUD: "${LLM_ALLOW_CLOUD-}"
      LLM_RESPONSE_HEALING: "${LLM_RESPONSE_HEALING-}"
      # v3.1 Vision auto-fill.
      VISION_ENABLED: "${VISION_ENABLED-}"
      VISION_MAX_IMAGES_PER_REQUEST: "${VISION_MAX_IMAGES_PER_REQUEST-}"
      VISION_DAILY_COST_CAP_USD: "${VISION_DAILY_COST_CAP_USD-}"
      VISION_LOG_IMAGE_HASHES_ONLY: "${VISION_LOG_IMAGE_HASHES_ONLY-}"
      # v3.1 Item-value pricing.
      PRICING_ENABLED: "${PRICING_ENABLED-}"
      PRICING_PROVIDERS: "${PRICING_PROVIDERS-}"
      PRICING_CACHE_DAYS: "${PRICING_CACHE_DAYS-}"
      PRICING_MAX_SAMPLES: "${PRICING_MAX_SAMPLES-}"
      PRICING_MULTIPROVIDER: "${PRICING_MULTIPROVIDER-}"
      PRICING_DAILY_COST_CAP_USD: "${PRICING_DAILY_COST_CAP_USD-}"
      PRICING_WEB_SEARCH_MAX_RESULTS: "${PRICING_WEB_SEARCH_MAX_RESULTS-}"
      PRICING_WEB_SEARCH_MAX_TOTAL: "${PRICING_WEB_SEARCH_MAX_TOTAL-}"
      PRICING_WEB_SEARCH_DOMAINS: "${PRICING_WEB_SEARCH_DOMAINS-}"
      # eBay Browse API (pricing provider).
      EBAY_APP_ID: "${EBAY_APP_ID-}"
      EBAY_CERT_ID: "${EBAY_CERT_ID-}"
      EBAY_MARKETPLACE_ID: "${EBAY_MARKETPLACE_ID-}"
      EBAY_ENVIRONMENT: "${EBAY_ENVIRONMENT-}"
    volumes:
      - /volume1/docker/whole-home-inventory-system/database:/app/database
      - /volume1/docker/whole-home-inventory-system/uploads:/app/backend/uploads
      - /volume1/docker/whole-home-inventory-system/backups:/app/backend/backups
      # Shared certs volume. Generate once on a workstation with mkcert
      # installed via `cd frontend && node scripts/generate-certs.js`, then
      # copy the `certs/` directory into the path below.
      - /volume1/docker/whole-home-inventory-system/certs:/app/certs:ro
    healthcheck:
      test: ["CMD", "curl", "-kfsS", "https://localhost:27182/api/health"]
      interval: 30s
      timeout: 5s
      start_period: 15s
      retries: 3
    # NAS stacks always run Redis (no profile gating), so the backend must
    # wait for it to be healthy before trying to create the ARQ pool on
    # startup. Otherwise a slow Redis boot can leave the backend in the
    # synchronous-fallback path for the first ~30s after startup.
    depends_on:
      redis:
        condition: service_healthy
    networks:
      - whole-home-inventory-system-network
    restart: unless-stopped

  caddy:
    build:
      # Context must be the repo root so the build can COPY the top-level
      # Caddyfile into the runtime stage.
      context: .
      dockerfile: frontend/Dockerfile.prod
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"  # HTTP/3
    environment:
      WHIS_DOMAIN: "${WHIS_DOMAIN:-whis.local}"
      CADDY_ACME_EMAIL: "${CADDY_ACME_EMAIL:-admin@whis.local}"
    depends_on:
      backend:
        condition: service_healthy
    volumes:
      # Persist Caddy's TLS state across restarts — ACME account keys, LE
      # certs, and the internal CA used when WHIS_DOMAIN isn't publicly
      # routable.
      - /volume1/docker/whole-home-inventory-system/caddy-data:/data
      - /volume1/docker/whole-home-inventory-system/caddy-config:/config
    healthcheck:
      test:
        - "CMD-SHELL"
        - "wget -q -O /dev/null --no-check-certificate https://localhost/ || wget -q -O /dev/null http://localhost/"
      interval: 30s
      timeout: 5s
      start_period: 15s
      retries: 3
    networks:
      - whole-home-inventory-system-network
    restart: unless-stopped

  # ---------------------------------------------------------------------------
  # v3.0: always-on Redis + ARQ worker for the NAS deploy. No profile
  # gating here — NAS stacks get the async job queue by default so backup
  # create/restore and thumbnail generation run off the request thread.
  # ---------------------------------------------------------------------------

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--save", "60", "1", "--appendonly", "yes"]
    volumes:
      - /volume1/docker/whole-home-inventory-system/redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
    networks:
      - whole-home-inventory-system-network
    restart: unless-stopped

  worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
    command: ["arq", "app.jobs.worker.WorkerSettings"]
    # Keep this env block in sync with the backend service above — the
    # worker imports app.settings at boot so every fail-fast guard runs
    # on both sides, and vision/pricing tasks need the same LLM creds
    # their callers do.
    environment:
      BYPASS_AUTH: "false"
      SECRET_KEY: ${SECRET_KEY:?SECRET_KEY must be set in the environment or .env file}
      DATABASE_URL: "${DATABASE_URL:-sqlite:////app/database/whis.db}"
      REDIS_URL: "${REDIS_URL:-redis://redis:6379/0}"
      UPLOAD_DIR: "/app/backend/uploads"
      BACKUP_DIR: "/app/backend/backups"
      LOG_LEVEL: "${LOG_LEVEL:-INFO}"
      LOG_FORMAT: "${LOG_FORMAT-}"
      DEBUG: "false"
      MAX_UPLOAD_BYTES: "${MAX_UPLOAD_BYTES-}"
      MAX_IMAGE_DIMENSION: "${MAX_IMAGE_DIMENSION-}"
      DB_POOL_SIZE: "${DB_POOL_SIZE-}"
      DB_MAX_OVERFLOW: "${DB_MAX_OVERFLOW-}"
      DB_POOL_RECYCLE_SECONDS: "${DB_POOL_RECYCLE_SECONDS-}"
      OTEL_ENABLED: "${OTEL_ENABLED-}"
      OTEL_SERVICE_NAME: "${OTEL_SERVICE_NAME-}"
      OTEL_EXPORTER_OTLP_ENDPOINT: "${OTEL_EXPORTER_OTLP_ENDPOINT-}"
      LLM_BASE_URL: "${LLM_BASE_URL-}"
      LLM_API_KEY: "${LLM_API_KEY-}"
      LLM_MODEL: "${LLM_MODEL-}"
      LLM_PRICING_MODEL: "${LLM_PRICING_MODEL-}"
      LLM_TIMEOUT_SECONDS: "${LLM_TIMEOUT_SECONDS-}"
      LLM_ALLOW_CLOUD: "${LLM_ALLOW_CLOUD-}"
      LLM_RESPONSE_HEALING: "${LLM_RESPONSE_HEALING-}"
      VISION_ENABLED: "${VISION_ENABLED-}"
      VISION_MAX_IMAGES_PER_REQUEST: "${VISION_MAX_IMAGES_PER_REQUEST-}"
      VISION_DAILY_COST_CAP_USD: "${VISION_DAILY_COST_CAP_USD-}"
      VISION_LOG_IMAGE_HASHES_ONLY: "${VISION_LOG_IMAGE_HASHES_ONLY-}"
      PRICING_ENABLED: "${PRICING_ENABLED-}"
      PRICING_PROVIDERS: "${PRICING_PROVIDERS-}"
      PRICING_CACHE_DAYS: "${PRICING_CACHE_DAYS-}"
      PRICING_MAX_SAMPLES: "${PRICING_MAX_SAMPLES-}"
      PRICING_MULTIPROVIDER: "${PRICING_MULTIPROVIDER-}"
      PRICING_DAILY_COST_CAP_USD: "${PRICING_DAILY_COST_CAP_USD-}"
      PRICING_WEB_SEARCH_MAX_RESULTS: "${PRICING_WEB_SEARCH_MAX_RESULTS-}"
      PRICING_WEB_SEARCH_MAX_TOTAL: "${PRICING_WEB_SEARCH_MAX_TOTAL-}"
      PRICING_WEB_SEARCH_DOMAINS: "${PRICING_WEB_SEARCH_DOMAINS-}"
      EBAY_APP_ID: "${EBAY_APP_ID-}"
      EBAY_CERT_ID: "${EBAY_CERT_ID-}"
      EBAY_MARKETPLACE_ID: "${EBAY_MARKETPLACE_ID-}"
      EBAY_ENVIRONMENT: "${EBAY_ENVIRONMENT-}"
    volumes:
      - /volume1/docker/whole-home-inventory-system/database:/app/database
      - /volume1/docker/whole-home-inventory-system/uploads:/app/backend/uploads
      - /volume1/docker/whole-home-inventory-system/backups:/app/backend/backups
      - /volume1/docker/whole-home-inventory-system/certs:/app/certs:ro
    depends_on:
      redis:
        condition: service_healthy
      backend:
        condition: service_healthy
    networks:
      - whole-home-inventory-system-network
    restart: unless-stopped

networks:
  whole-home-inventory-system-network:
    driver: bridge

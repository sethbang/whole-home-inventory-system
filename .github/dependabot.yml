# Dependabot keeps backend (pip), frontend (npm), and CI (github-actions)
# dependencies up to date. Minor and patch updates are grouped into one PR
# per ecosystem per week to keep review noise low; major bumps arrive as
# individual PRs so they can be vetted one at a time. Review requests come
# from .github/CODEOWNERS (Dependabot's `reviewers` option was retired).

version: 2

updates:
  # --- Backend (FastAPI / SQLAlchemy / etc.) ---------------------------------
  - package-ecosystem: pip
    directory: "/backend"
    schedule:
      interval: weekly
      day: monday
      time: "08:00"
      timezone: "America/New_York"
    open-pull-requests-limit: 10
    # requirements.txt uses ranges (`>=X,<Y`) with no lockfile, so there is
    # no resolved version for Dependabot to classify as minor/patch/major.
    # Those updates never matched the `update-types` group below and arrived
    # as one PR per package (e.g. #38-#49), each only raising a floor that CI
    # and the Docker build already exceed, since pip installs the newest
    # in-range release. `increase-if-necessary` limits range updates to
    # releases outside the range (real major bumps, still one PR each);
    # `==` pins keep flowing through the group as before.
    versioning-strategy: increase-if-necessary
    labels:
      - "dependencies"
      - "backend"
    # redis is ARQ's runtime dependency and arq pins it (redis<6 as of arq
    # 0.28). Raise our cap only when arq does, as a deliberate change.
    ignore:
      - dependency-name: "redis"
        update-types: ["version-update:semver-major"]
    groups:
      backend-minor-and-patch:
        applies-to: version-updates
        update-types:
          - "minor"
          - "patch"
      backend-security:
        applies-to: security-updates
        update-types:
          - "minor"
          - "patch"
          - "major"

  # --- Frontend (React / Vite / etc.) ----------------------------------------
  - package-ecosystem: npm
    directory: "/frontend"
    schedule:
      interval: weekly
      day: monday
      time: "08:00"
      timezone: "America/New_York"
    open-pull-requests-limit: 10
    labels:
      - "dependencies"
      - "frontend"
    # Pin the React major to avoid unsolicited React 20 (or whatever comes
    # after). Same for React Router, which has historically shipped breaking
    # majors. Remove when the project is ready to move up.
    #
    # TypeScript majors are held until the toolchain catches up: as of
    # 2026-11 openapi-typescript peers on `typescript ^5.x` and
    # typescript-eslint on `<6.1.0`, so TS 7 fails `npm install` outright.
    ignore:
      - dependency-name: "react"
        update-types: ["version-update:semver-major"]
      - dependency-name: "react-dom"
        update-types: ["version-update:semver-major"]
      - dependency-name: "react-router-dom"
        update-types: ["version-update:semver-major"]
      - dependency-name: "typescript"
        update-types: ["version-update:semver-major"]
    groups:
      frontend-minor-and-patch:
        applies-to: version-updates
        update-types:
          - "minor"
          - "patch"
      frontend-security:
        applies-to: security-updates
        update-types:
          - "minor"
          - "patch"
          - "major"

  # --- GitHub Actions pinned by SHA or tag -----------------------------------
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
      - "ci"
    # Action bumps rarely break anything for this workflow; one weekly PR
    # instead of one per action.
    groups:
      github-actions:
        patterns:
          - "*"

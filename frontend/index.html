<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    
    <!-- iOS specific -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="WHIS" />
    
    <!-- iOS icons in order of preference -->
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="apple-touch-icon-precomposed" href="/apple-touch-icon-precomposed.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <link rel="apple-touch-icon" sizes="192x192" href="/apple-touch-icon-192x192.png" />
    <link rel="apple-touch-icon" sizes="512x512" href="/apple-touch-icon-512x512.png" />
    
    <!-- Standard favicon -->
    <link rel="icon" type="image/png" sizes="192x192" href="/apple-touch-icon-192x192.png" />
    
    <!-- PWA manifest and icons -->
    <link rel="manifest" href="/site.webmanifest" type="application/manifest+json" />
    <meta name="theme-color" content="#ffffff" />
    <meta name="color-scheme" content="light dark" />
    <meta name="application-name" content="WHIS" />

    <!--
      Day / Night / System-sync FOUC guard. Mirrors the resolution logic in
      ThemeContext so the document already has the right ``.dark`` class
      before React mounts and paints. Must stay synchronous and inline.
    -->
    <script>
      (function () {
        try {
          var stored = window.localStorage.getItem('whis-theme');
          var mode = stored === 'day' || stored === 'night' || stored === 'system'
            ? stored
            : 'system';
          var prefersDark = false;
          if (mode === 'system' && window.matchMedia) {
            prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
          }
          var dark = mode === 'night' || (mode === 'system' && prefersDark);
          if (dark) document.documentElement.classList.add('dark');
        } catch (_) {
          /* localStorage / matchMedia unavailable — fall back to day. */
        }
      })();
    </script>

    <title>WHIS - Whole-Home Inventory System</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
